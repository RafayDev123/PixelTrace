# Local PostgreSQL for PixelTrace development. Credentials are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pixeltrace-db:/var/lib/postgresql/data
volumes:
  pixeltrace-db:
